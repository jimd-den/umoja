[workspace]
resolver = "2"
members = [
    "crates/umoja-domain",
    "crates/umoja-app",
    "crates/umoja-infra",
    "crates/umoja-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
umoja-domain = { path = "crates/umoja-domain" }
umoja-app = { path = "crates/umoja-app" }
umoja-infra = { path = "crates/umoja-infra" }

chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "bundled-full", "chrono"] }
rhai = { version = "1.19", features = ["serde", "sync"] }
glob = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
